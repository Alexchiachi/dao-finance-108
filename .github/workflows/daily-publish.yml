name: Daily Auto Publish & Deploy

on:
  # 每天台北/北京時間 00:00（UTC 16:00）自動執行，無須開機
  schedule:
    - cron: '0 16 * * *'
  # 當有代碼推送至 main 分支時觸發
  push:
    branches:
      - main
  # 允許在 GitHub 網頁上手動單鍵觸發
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update RSS Feed & Sitemap
        run: |
          node tools/update_feed.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
